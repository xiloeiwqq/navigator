name: Sync published navigator catalog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: navigator-catalog-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: codex/navigator-data
          path: feed
      - run: python3 sync_hosted_catalog.py feed/hosted
      - name: Publish changed catalog
        run: |
          git -C feed config user.name 'github-actions[bot]'
          git -C feed config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C feed add -A -- hosted
          if git -C feed diff --cached --quiet; then exit 0; fi
          git -C feed commit -m 'Sync published campuses'
          git -C feed push origin HEAD:refs/heads/codex/navigator-data
